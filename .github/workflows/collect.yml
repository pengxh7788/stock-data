name: collect-quotes

on:
  schedule:
    - cron: '35 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集行情
        run: python3 collect.py

      - name: 校验数据（不合格则中止，不推送坏数据）
        run: python3 verify_dataset.py

      - name: 保存数据快照
        uses: actions/upload-artifact@v4
        with:
          name: data-backup
          path: data/
          retention-days: 3
          compression-level: 1

      - name: 提交数据（覆盖式，仓库体积恒定）
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan data-snapshot
          git rm -rf --cached . > /dev/null 2>&1 || true

          # 关键：把工作流文件同步成远端最新版，避免本次运行检出的是旧版、
          # 推送时等于回退工作流 → 被 GitHub 以 "without `workflows` permission" 拒绝
          git fetch --depth=1 origin main:refs/remotes/origin/main > /dev/null 2>&1 || true
          for f in .github/workflows/collect.yml collect.py verify_dataset.py; do
            git show origin/main:$f > $f 2>/dev/null || true
          done
          if true; then
            echo "已同步工作流文件为远端最新版"
          else
            echo "同步工作流失败，继续"
          fi

          git add -A
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git branch -D main || true
          git branch -m data-snapshot main
          git push -f origin main

          echo "完成：仓库只保留 1 个提交，体积恒定"
