name: collect-quotes

# 收盘后自动补数据：
#   15:01 主跑（约 19 分钟出数据）  |  15:26 兜底（主跑漏跑/延迟时补上，已有当天数据则直接跳过）
on:
  schedule:
    - cron: '0 7 * * 1-5'     # 北京 15:00 收盘即采（UTC 07:00）
    - cron: '26 7 * * 1-5'    # 北京 15:26 兜底
    - cron: '50 7 * * 1-5'    # 北京 15:50 兜底（前两次被 GitHub 丢弃时补）
    - cron: '30 9 * * 1-5'    # 北京 17:30 兜底
    - cron: '30 12 * * 1-5'   # 北京 20:30 收尾兜底
  workflow_dispatch:
    inputs:
      force:
        description: '强制重采（手动触发默认 1，忽略"今天已采过"）'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 今天是否已采过（兜底触发时跳过）
        id: guard
        env:
          TZ: Asia/Shanghai
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "1" ]; then
            echo "手动强制重采，跳过"已采过"判断"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          D=$(date +%F)
          HAVE=$(python3 -c "import json;print(json.load(open('data/meta.json'))['date'])" 2>/dev/null || echo none)
          echo "今天=$D，仓库里=$HAVE"
          if [ "$HAVE" = "$D" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 采集行情
        if: steps.guard.outputs.skip != 'true'
        run: python3 collect.py

      - name: 校验数据（不合格则中止，不推送坏数据）
        if: steps.guard.outputs.skip != 'true'
        run: python3 verify_dataset.py

      - name: 保存数据快照
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-backup
          path: data/
          retention-days: 3
          compression-level: 1

      - name: 提交数据（覆盖式，仓库体积恒定）
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan data-snapshot
          git rm -rf --cached . > /dev/null 2>&1 || true

          # 关键：把工作流文件同步成远端最新版，避免本次运行检出的是旧版、
          # 推送时等于回退工作流 → 被 GitHub 以 "without `workflows` permission" 拒绝
          # 注意：必须 fetch 到一个"新 ref"并用 --force。浅克隆里更新已存在的
          # refs/remotes/origin/main 会被 git 静默拒绝（非快进），导致同步拿到旧文件。
          git fetch --depth=1 --force origin main:refs/remotes/origin/main-latest > /dev/null 2>&1 || true
          for f in .github/workflows/collect.yml collect.py verify_dataset.py; do
            git show refs/remotes/origin/main-latest:$f > $f 2>/dev/null || true
          done
          if true; then
            echo "已同步工作流文件为远端最新版"
          else
            echo "同步工作流失败，继续"
          fi

          git add -A
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          git branch -D main || true
          git branch -m data-snapshot main
          git push -f origin main

          echo "完成：仓库只保留 1 个提交，体积恒定"
